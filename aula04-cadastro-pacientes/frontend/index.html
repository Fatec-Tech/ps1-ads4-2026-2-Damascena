<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Pacientes — Aula 04</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-5">
    <h1 class="mb-2">Cadastro de Pacientes</h1>
    <p class="text-secondary mb-4">Aula 04 — Express e CRUD completo</p>

    <div id="mensagem" role="status" aria-live="polite"></div>

    <form id="form-paciente" class="row g-3 mb-4">
      <input type="hidden" id="id">
      <div class="col-md-4">
        <label for="nome" class="form-label">Nome</label>
        <input type="text" class="form-control" id="nome" required>
      </div>
      <div class="col-md-4">
        <label for="email" class="form-label">E-mail</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="col-md-2">
        <label for="nascimento" class="form-label">Nascimento</label>
        <input type="date" class="form-control" id="nascimento" required>
      </div>
      <div class="col-md-2 d-flex align-items-end gap-2">
        <button type="submit" id="btn-salvar" class="btn btn-primary flex-grow-1">Salvar</button>
        <button type="button" id="btn-cancelar" class="btn btn-outline-secondary d-none">Cancelar</button>
      </div>
    </form>

    <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
      <h2 class="h4 m-0">Pacientes cadastrados</h2>
      <button type="button" id="btn-recarregar" class="btn btn-outline-primary btn-sm">Atualizar lista</button>
    </div>
    <p id="carregando" class="text-secondary">Carregando pacientes... O servidor gratuito pode demorar para despertar.</p>
    <div class="table-responsive">
      <table class="table table-striped align-middle">
        <thead>
          <tr><th>Nome</th><th>E-mail</th><th>Nascimento</th><th>Ações</th></tr>
        </thead>
        <tbody id="tabela-pacientes"></tbody>
      </table>
    </div>
    <p class="small text-secondary">Dados de exemplo. Esta atividade usa memória: os cadastros não são permanentes.</p>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
